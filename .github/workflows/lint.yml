name: Linting

on:
  pull_request:
  push:

jobs:
  rust-clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust 1.95 with Clippy
      run: rustup toolchain install 1.95.0 --profile minimal --component clippy
    - name: Clippy
      run: cargo +1.95.0 clippy --manifest-path rust/microhs-runtime/Cargo.toml --all-targets -- -D warnings

  hlint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: haskell-actions/hlint-setup@v2
      with:
        version: "3.10"
    - uses: haskell-actions/hlint-run@v2
      with:
        path: "."
        fail-on: suggestion
